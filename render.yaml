services:
  - type: web
    name: toolsyourway
    runtime: node
    region: singapore  # Closest to India
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: SECURE_COOKIES
        value: "true"
      # Canonical public origin. OAuth callbacks and payment redirects
      # are built from this — never let it fall back to localhost in prod.
      - key: BASE_URL
        value: "https://www.toolsyourway.com"
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        value: "https://www.toolsyourway.com/api/auth/microsoft/callback"
      # Razorpay (India). KEY_ID is sent to the browser to open Checkout;
      # KEY_SECRET stays server-side for HMAC signature verification.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Stripe (international cards)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # PayPal (global)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # LinkedIn / X / Facebook / Replicate — set in dashboard if used
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      # OAuth 1.0a (X) — needed for media upload (image/GIF/video).
      # If unset, server falls back to TWITTER_CLIENT_ID/_SECRET.
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      # Meta app — powers BOTH Facebook and Instagram Graph API publishing.
      # Whitelist redirect URIs in the Meta app:
      #   https://www.toolsyourway.com/api/social/instagram/oauth/callback
      #   https://www.toolsyourway.com/api/social/facebook/callback
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
